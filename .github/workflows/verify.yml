name: Verify

on:
  workflow_call:
    inputs:
      run-docker-smoke:
        description: Run Docker smoke tests
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    name: Fmt Vet Test Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: make fmt && git diff --exit-code

      - name: Run go vet
        run: make vet

      - name: Run unit tests
        run: make test

      - name: Build binary
        run: make build

      - name: Compare release binary size
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          base_sha=$(git rev-parse FETCH_HEAD)
          base_dir="$RUNNER_TEMP/binary-size-base"
          mkdir "$base_dir"
          git archive "$base_sha" | tar -x -C "$base_dir"

          CGO_ENABLED=0 go -C "$base_dir" build -ldflags="-s -w" -o "$RUNNER_TEMP/secret-injector-base" ./cmd/secret-injector
          CGO_ENABLED=0 go build -ldflags="-s -w" -o "$RUNNER_TEMP/secret-injector-head" ./cmd/secret-injector

          base_size=$(stat -c %s "$RUNNER_TEMP/secret-injector-base")
          head_size=$(stat -c %s "$RUNNER_TEMP/secret-injector-head")
          delta=$((head_size - base_size))
          printf -v signed_delta '%+d' "$delta"

          {
            echo '### Release binary size'
            echo
            echo '| Revision | Bytes |'
            echo '| --- | ---: |'
            echo "| Base ($BASE_REF) | $base_size |"
            echo "| PR | $head_size |"
            echo "| Change | $signed_delta |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Release binary size::$head_size bytes ($signed_delta bytes)"

          jq -n \
            --argjson base_size "$base_size" \
            --argjson head_size "$head_size" \
            '{base_size: $base_size, head_size: $head_size}' \
            > "$RUNNER_TEMP/binary-size-report.json"

      - name: Upload binary-size report
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: binary-size-report
          path: ${{ runner.temp }}/binary-size-report.json
          if-no-files-found: error
          retention-days: 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.9.0
          args: --build-tags=integration --timeout=5m

  nix-package:
    name: Nix Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Build and test package
        run: nix flake check --print-build-logs

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - quality
      - lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          # Keep integration-only dependencies out of the unit-test cache key.
          cache-dependency-path: go.mod

      - name: Verify Docker availability
        run: docker version

      - name: Run integration tests
        run: make itest

  docker-smoke:
    name: Docker Smoke Tests
    if: ${{ inputs.run-docker-smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - quality
      - lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Docker availability
        run: docker version

      - name: Prepare smoke build metadata
        run: |
          {
            echo "SMOKE_VERSION=dev"
            echo "SMOKE_COMMIT=${GITHUB_SHA::7}"
            echo "SMOKE_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"

      - name: Build binary for container image
        run: CGO_ENABLED=0 GOOS=linux GOARCH=$(go env GOARCH) go build -ldflags "-X main.version=${SMOKE_VERSION} -X main.commit=${SMOKE_COMMIT} -X main.date=${SMOKE_DATE}" -o secret-injector ./cmd/secret-injector

      - name: Build distribution image
        run: docker build -t secret-injector:ci .

      - name: Smoke test image entrypoint
        run: test "$(docker run --rm secret-injector:ci --version)" = "secret-injector version ${SMOKE_VERSION} (commit=${SMOKE_COMMIT} date=${SMOKE_DATE})"

      - name: Smoke test copy-from flow
        run: |
          docker build -f - -t secret-injector-copytest:ci . <<'EOF'
          FROM alpine:3.22
          COPY --from=secret-injector:ci /secret-injector /usr/local/bin/secret-injector
          ENTRYPOINT ["/usr/local/bin/secret-injector", "--version"]
          EOF
          test "$(docker run --rm secret-injector-copytest:ci)" = "secret-injector version ${SMOKE_VERSION} (commit=${SMOKE_COMMIT} date=${SMOKE_DATE})"
