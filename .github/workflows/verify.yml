name: Verify

on:
  workflow_call:
    inputs:
      run-docker-smoke:
        description: Run Docker smoke tests
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    name: Fmt Vet Test Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: make fmt && git diff --exit-code

      - name: Run go vet
        run: make vet

      - name: Run unit tests
        run: make test

      - name: Build binary
        run: make build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4.0
          args: --timeout=5m

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - quality
      - lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Docker availability
        run: docker version

      - name: Run integration tests
        run: make itest

  docker-smoke:
    name: Docker Smoke Tests
    if: ${{ inputs.run-docker-smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - quality
      - lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Docker availability
        run: docker version

      - name: Prepare smoke build metadata
        run: |
          echo "SMOKE_VERSION=dev" >> "$GITHUB_ENV"
          echo "SMOKE_COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "SMOKE_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build binary for container image
        run: CGO_ENABLED=0 GOOS=linux GOARCH=$(go env GOARCH) go build -ldflags "-X main.version=${SMOKE_VERSION} -X main.commit=${SMOKE_COMMIT} -X main.date=${SMOKE_DATE}" -o secret-injector ./cmd/secret-injector

      - name: Build distribution image
        run: docker build -t secret-injector:ci .

      - name: Smoke test image entrypoint
        run: test "$(docker run --rm secret-injector:ci --version)" = "secret-injector version ${SMOKE_VERSION} (commit=${SMOKE_COMMIT} date=${SMOKE_DATE})"

      - name: Smoke test copy-from flow
        run: |
          docker build -f - -t secret-injector-copytest:ci <<'EOF'
          FROM alpine:3.22
          COPY --from=secret-injector:ci /secret-injector /usr/local/bin/secret-injector
          ENTRYPOINT ["/usr/local/bin/secret-injector", "--version"]
          EOF
          test "$(docker run --rm secret-injector-copytest:ci)" = "secret-injector version ${SMOKE_VERSION} (commit=${SMOKE_COMMIT} date=${SMOKE_DATE})"
