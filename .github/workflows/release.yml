name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: SemVer tag to release (vX.Y.Z or prerelease)
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.export.outputs.release-tag }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
    steps:
      - name: Validate SemVer format
        run: |
          tag="${RELEASE_TAG}"
          semver_regex='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$tag" =~ $semver_regex ]]; then
            echo "Invalid release tag: '$tag'. Expected vX.Y.Z or vX.Y.Z-<prerelease>." >&2
            exit 1
          fi

      - name: Ensure workflow runs from main
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Run this workflow from the main branch." >&2
            exit 1
          fi

      - name: Checkout
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v6

      - name: Ensure tag does not already exist
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ -n "$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}")" ]]; then
            echo "Tag ${RELEASE_TAG} already exists." >&2
            exit 1
          fi

      - name: Create and push tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git tag "${RELEASE_TAG}" "${GITHUB_SHA}"
          git push origin "${RELEASE_TAG}"

      - id: export
        name: Export release tag
        run: echo "release-tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify Release Candidate
    needs:
      - prepare-release
    uses: ./.github/workflows/verify.yml
    with:
      run-docker-smoke: false

  validate-release-artifacts:
    name: Validate Release Artifacts
    needs:
      - prepare-release
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout release tag
        run: |
          git fetch --tags origin
          git checkout "refs/tags/${RELEASE_TAG}"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup GoReleaser
        uses: ./.github/actions/setup-goreleaser

      - name: Verify Docker availability
        run: docker version

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build release snapshot
        run: goreleaser release --snapshot --clean --skip=publish
        env:
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}

      - name: Validate release artifacts
        run: make verify-release-artifacts

  release:
    name: Build And Publish Artifacts
    needs:
      - prepare-release
      - verify
      - validate-release-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout release tag
        run: |
          git fetch --tags origin
          git checkout "refs/tags/${RELEASE_TAG}"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup GoReleaser
        uses: ./.github/actions/setup-goreleaser

      - name: Verify Docker availability
        run: docker version

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish artifacts with GoReleaser
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}

      - name: Verify published image manifest
        run: |
          image="ghcr.io/kahlstrm/secret-injector:${RELEASE_TAG#v}"
          expected='[["linux","amd64"],["linux","arm64"]]'
          actual=$(docker buildx imagetools inspect --raw "$image" | jq -c '[.manifests[] | select(.platform.os != "unknown") | [.platform.os, .platform.architecture]] | sort')
          if [[ "$actual" != "$expected" ]]; then
            echo "Unexpected platforms for $image: $actual" >&2
            exit 1
          fi
