name: Refresh Dependabot Nix Vendor Hash

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-nix-vendor-hash-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  calculate:
    name: Generate Verified Hash Patch
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.fix-hashes.outputs.changed }}
      patch: ${{ steps.fix-hashes.outputs.patch }}
    steps:
      - name: Validate pull request scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" | jq -r '.[].filename')
          if ! grep -Eq '^go\.(mod|sum)$' <<<"$files"; then
            echo "Dependabot pull request does not update Go modules" >&2
            exit 1
          fi
          unexpected=$(grep -Ev '^(go\.(mod|sum)|flake\.nix)$' <<<"$files" || true)
          if [ -n "$unexpected" ]; then
            echo "Refusing to run with unexpected changed files:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Checkout dependency update
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - id: fix-hashes
        name: Fix and verify Nix hashes
        working-directory: candidate
        run: |
          if nix flake check -L; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          determinate-nixd fix hashes --auto-apply
          if git diff --quiet; then
            echo "Nix failed without producing an automatic hash fix" >&2
            exit 1
          fi

          nix flake check -L
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "patch=$(git diff --binary | base64 -w0)" >> "$GITHUB_OUTPUT"

  commit:
    name: Commit Vendor Hash
    needs:
      - calculate
    if: needs.calculate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
    steps:
      # The dependency build above never receives this job's write token. This
      # job only applies and validates the patch it produced.
      - name: Checkout dependency update
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate

      - name: Apply verified hash patch
        working-directory: candidate
        env:
          HASH_PATCH: ${{ needs.calculate.outputs.patch }}
        run: |
          patch_file="$RUNNER_TEMP/nix-hash.patch"
          printf '%s' "$HASH_PATCH" | base64 -d > "$patch_file"
          git apply --check "$patch_file"
          git apply "$patch_file"

          if [ "$(git diff --name-only)" != "flake.nix" ]; then
            echo "Hash fixer changed files other than flake.nix" >&2
            exit 1
          fi
          if [ "$(git diff --numstat -- flake.nix)" != $'1\t1\tflake.nix' ]; then
            echo "Hash fixer changed more than one line" >&2
            git diff -- flake.nix >&2
            exit 1
          fi

          removed=$(git diff --unified=0 -- flake.nix | sed -n '/^---/d; /^-/p')
          added=$(git diff --unified=0 -- flake.nix | sed -n '/^+++/d; /^+/p')
          if ! grep -Eq '^-[[:space:]]*vendorHash = "sha256-[A-Za-z0-9+/]{43}=";[[:space:]]*$' <<<"$removed" ||
             ! grep -Eq '^\+[[:space:]]*vendorHash = "sha256-[A-Za-z0-9+/]{43}=";[[:space:]]*$' <<<"$added"; then
            echo "Hash fixer changed something other than the vendorHash value" >&2
            git diff -- flake.nix >&2
            exit 1
          fi
          git diff --check

      - name: Commit and rerun CI
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          git commit -m "ci: refresh nix vendor hash"
          git push origin "HEAD:$HEAD_REF"
          # GITHUB_TOKEN pushes do not trigger workflows, so dispatch CI for
          # the new head explicitly.
          gh workflow run ci.yml --ref "$HEAD_REF"
